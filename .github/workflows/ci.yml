name: CI

# Manual runs and code changes in pull requests only, to save Actions minutes
# (free once the repository is public).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Unit tests and reference harness
        run: sh scripts/test.sh
      - name: Universal release build
        run: |
          swift build -c release --product BridgeKitCore --arch arm64 --arch x86_64
          swift build -c release --product BridgeKitRemote --arch arm64 --arch x86_64
